name: Documentation

on:
  push:
    branches: [main]
    paths:
      - 'Sources/Gymnazo/**'
      - 'Vendor/**'
      - '.gitmodules'
      - 'Package.swift'
      - 'Package.resolved'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Select Xcode
        id: xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          echo "build=$(xcodebuild -version | awk '/Build version/ { print $3 }')" >> "$GITHUB_OUTPUT"

      - name: Cache documentation build
        uses: actions/cache@v6
        with:
          path: |
            DerivedData/Build
            DerivedData/ModuleCache.noindex
            DerivedData/SourcePackages
          key: ${{ runner.os }}-${{ runner.arch }}-xcode-${{ steps.xcode.outputs.build }}-build-v1-${{ hashFiles('Package.swift', 'Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-xcode-${{ steps.xcode.outputs.build }}-build-v1-${{ hashFiles('Package.swift', 'Package.resolved') }}-

      - name: Build Documentation
        run: |
          xcodebuild docbuild \
            -scheme Gymnazo \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath "$PWD/DerivedData" \
            -clonedSourcePackagesDirPath "$PWD/DerivedData/SourcePackages" \
            -onlyUsePackageVersionsFromResolvedFile \
            -skipPackagePluginValidation \
            DOCC_HOSTING_BASE_PATH=Gymnazo
          xcrun docc process-archive transform-for-static-hosting \
            "$PWD/DerivedData/Build/Products/Debug/Gymnazo.doccarchive" \
            --hosting-base-path Gymnazo \
            --output-path ./docs

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
